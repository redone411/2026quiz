<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>성경 퀴즈 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one centered study card; slim progress bar on top; answer controls under the question */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#1b2826; --muted:#5d6c69; --line:#d5ddd8;
  --accent:#1f6a73; --accent-ink:#ffffff; --accent-soft:#dcebeb;
  --hl:#e9a91f; --hl-soft:#fdf1d6;
  --ok:#277a4a; --ok-bg:#e1f2e7; --bad:#b83a2c; --bad-bg:#fbe6e2;
  --quote:#f6f8f5;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1a2321; --ink:#e4ebe8; --muted:#9aaba7; --line:#2d3a37;
  --accent:#5fb0b8; --accent-ink:#0d1716; --accent-soft:#1f3436;
  --hl:#e3ad3c; --hl-soft:#3a2f17;
  --ok:#72cf98; --ok-bg:#16301f; --bad:#ff8d7c; --bad-bg:#3a1c18; --quote:#151d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2321; --ink:#e4ebe8; --muted:#9aaba7; --line:#2d3a37;
  --accent:#5fb0b8; --accent-ink:#0d1716; --accent-soft:#1f3436;
  --hl:#e3ad3c; --hl-soft:#3a2f17;
  --ok:#72cf98; --ok-bg:#16301f; --bad:#ff8d7c; --bad-bg:#3a1c18; --quote:#151d1b; color-scheme:dark}
html{font-size:calc(17px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.25rem;color:var(--accent);background:none;border:0;padding:0;letter-spacing:.02em}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
.fontctl{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.fontctl button{border:0;background:none;padding:4px 12px;font-family:var(--f-display);color:var(--ink);min-width:44px;min-height:36px}
.fontctl button+button{border-left:1px solid var(--line)}
.fontctl .s{font-size:.8rem}.fontctl .l{font-size:1.15rem}
.track{height:5px;background:var(--line)}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* start */
.hero{padding-block:40px 8px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.hero p{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:24px;display:grid;gap:20px}
.field{display:grid;gap:8px}
.field>label,.field>.lbl{font-family:var(--f-display);font-size:1.05rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 140px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;line-height:1.35}
.seg button b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.seg button span{color:var(--muted);font-size:.85rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
select,.num{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.num{width:7em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:12px;padding:13px 22px;font-family:var(--f-display);font-size:1.1rem;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hl-soft);border-radius:12px;padding:14px 16px}

/* question */
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:22px;color:var(--muted);font-size:.85rem}
.qno{font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.78rem;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:12px;display:grid;gap:16px;min-width:0}
.intro{color:var(--muted);font-size:.92rem}
.passage{background:var(--quote);border-left:4px solid var(--accent);border-radius:4px 10px 10px 4px;padding:12px 14px;white-space:pre-line;font-size:.95rem;max-height:16em;overflow:auto}
.bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bank .k{font-family:var(--f-display);color:var(--muted);font-size:.9rem;margin-right:2px}
.chip{background:var(--hl-soft);border-radius:8px;padding:2px 10px;font-size:.95rem;border:1.5px solid transparent}
.chip.tap{padding:5px 13px;min-height:40px;line-height:1.4}
.chip.tap:hover:not(:disabled){border-color:var(--hl)}
.chip.tap:active:not(:disabled){transform:translateY(1px)}
.chip.tap:disabled{cursor:default;opacity:.6}
.bank-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;width:100%;margin-top:2px}
.hintrow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.hintbtn{padding:6px 16px;min-height:40px;font-size:1rem;border-radius:999px}
.memhint{font-family:var(--f-display);color:var(--accent);font-size:1.1rem;overflow-wrap:anywhere}
.prompt{font-size:1.15rem;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere}
.box{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;white-space:pre-line;line-height:1.95;overflow-wrap:anywhere}
.blank{display:inline-block;vertical-align:baseline;border:0;border-bottom:2.5px solid var(--hl);background:var(--hl-soft);border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;text-align:center;min-width:3.2em;max-width:100%;font-size:1em;line-height:1.5}
.blank.ok{border-color:var(--ok);background:var(--ok-bg)}
.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;line-height:1.55}
.opt .m{font-family:var(--f-display);color:var(--accent);min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{justify-content:center;font-family:var(--f-display);font-size:2.6rem;padding:14px;line-height:1}
.textans{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);resize:vertical}
textarea.textans{min-height:8em;line-height:1.7}
.order-items{display:grid;gap:8px}
.order-items .opt .m{font-size:1.1rem}
.order-items .opt.used{opacity:.4}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.slot{font-family:var(--f-display);font-size:1.2rem;border:2px solid var(--line);border-radius:8px;min-width:2.2em;text-align:center;padding:2px 6px}
.slot.on{border-color:var(--accent);background:var(--accent-soft)}
.match{display:grid;gap:10px}
.match .mr{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:10px;align-items:center}
.match .mr b{font-weight:400;font-family:var(--f-display)}
.match select.ok{border-color:var(--ok);background:var(--ok-bg)}
.match select.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb .v{font-family:var(--f-display);font-size:1.3rem}
.fb.ok .v{color:var(--ok)}.fb.bad .v{color:var(--bad)}
.fb .a{white-space:pre-line}
.fb .small{font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.9rem;justify-self:start}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:0 1 auto}
.kbd{color:var(--muted);font-size:.78rem;text-align:right;margin-top:6px}

/* finish */
.score{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.4rem;color:var(--muted)}
.wrong{display:flex;flex-wrap:wrap;gap:6px}
.wrong span{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:2px 9px;font-variant-numeric:tabular-nums;font-size:.9rem}
@media (max-width:480px){
  .hero h1{font-size:2rem}.card{padding:16px}.prompt{font-size:1.08rem}
  .match .mr{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
<style>
/* additions for the book quiz */
[hidden]{display:none!important}
.books{display:flex;flex-wrap:wrap;gap:8px}
.books button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:1.05rem;min-height:44px}
.books button span{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:4px}
.books button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{display:flex;gap:10px;align-items:center}
.check input{width:1.3em;height:1.3em;accent-color:var(--accent)}
.fb.neutral{background:var(--hl-soft)}
.fb.neutral .v{color:var(--ink)}
.self{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.self .btn{flex:1 1 140px;font-size:1.05rem;padding:11px 16px}
.self .yes{background:var(--ok);color:var(--surface)}
.self .no{background:var(--bad);color:var(--surface)}
.ref{font-size:.85rem;color:var(--muted)}
.ctitle{color:var(--muted)}
.wrong span{white-space:nowrap}
</style>

<header class="bar">
  <div class="bar-in">
    <button class="brand" id="home" type="button" title="처음 화면">성경 퀴즈 연습</button>
    <span class="stat" id="stat"></span>
    <div class="fontctl" role="group" aria-label="글씨 크기">
      <button type="button" class="s" id="fsm" aria-label="글씨 작게">가−</button>
      <button type="button" class="l" id="fsp" aria-label="글씨 크게">가+</button>
    </div>
  </div>
  <div class="track"><i id="trk"></i></div>
</header>

길을 지도하시리라"}],"books":["에스라","느헤미야","에스더","욥기","잠언","전도서","아가"]};</script>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CIRC = '①②③④⑤';
const TYPE = {fill:'빈칸 채우기', short:'단답형', mc:'객관식', memory:'암송'};
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
/* number every item within its book; memory verses come after the book's questions */
const ALL = [];
DATA.books.forEach(b => {
  let k = 0;
  DATA.items.filter(x => x.b === b).forEach(x => { x.k = ++k; ALL.push(x); });
  let m = 0;
  DATA.mem.filter(x => x.b === b).forEach(x => { x.k = ++m; x.isMem = true; ALL.push(x); });
});
ALL.forEach((x, i) => x.id = i);
const label = x => x.isMem ? `${x.b} 암송 ${x.k}` : `${x.b} ${x.k}번`;
const BOOKS = DATA.books.filter(b => ALL.some(x => x.b === b));

/* font size */
let scale = store.get('bz-scale', 1);
const applyScale = () => { document.documentElement.style.setProperty('--scale', scale); store.set('bz-scale', scale); };
applyScale();
$('#fsm').onclick = () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); applyScale(); };
$('#fsp').onclick = () => { scale = Math.min(1.8, +(scale + 0.1).toFixed(2)); applyScale(); };

const norm = s => String(s).normalize('NFC').replace(/[\s.,!?·“”‘’"'()\[\]{}~\-–—:;…<>/=]/g, '').toLowerCase();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function similarity(a, b){
  a = norm(a); b = norm(b);
  if (!a.length || !b.length) return 0;
  const n = b.length; let prev = new Array(n + 1).fill(0);
  for (let i = 1; i <= a.length; i++){ const cur = [0]; for (let j = 1; j <= n; j++) cur[j] = a[i-1] === b[j-1] ? prev[j-1] + 1 : Math.max(prev[j], cur[j-1]); prev = cur; }
  return 2 * prev[n] / (a.length + n);
}

let S = null;
const save = () => S && store.set('bz-session', S);
function setBar(){
  const trk = $('#trk'), st = $('#stat');
  if (!S || S.done){ trk.style.width = S && S.done ? '100%' : '0'; st.textContent = S && S.done ? '' : `${DATA.items.length}문항 · 암송 ${DATA.mem.length}`; return; }
  const total = S.deck.length, answered = Object.keys(S.res).length, ok = Object.values(S.res).filter(Boolean).length;
  trk.style.width = (100 * S.pos / total) + '%';
  st.textContent = `${S.pos + 1} / ${total} · 맞힘 ${ok}/${answered}`;
}

/* ---------- start ---------- */
let opt = store.get('bz-opt', {mode:'seq', books:BOOKS.slice(), chap:'all', mem:true, count:'all'});
opt.books = (opt.books || []).filter(b => BOOKS.includes(b)); if (!opt.books.length) opt.books = BOOKS.slice();
function chaptersOf(b){ return [...new Set(ALL.filter(x => x.b === b && !x.isMem).map(x => x.c))]; }
function startScreen(){
  const saved = store.get('bz-session', null);
  const resumable = saved && !saved.done && saved.deck && saved.pos < saved.deck.length;
  S = null; cur = null; setBar();
  view.innerHTML = `
  <section class="hero">
    <h1>성경 퀴즈 연습</h1>
    <p>${BOOKS.join(' · ')} — ${DATA.items.length}문항과 암송 구절 ${DATA.mem.length}개</p>
  </section>
  ${resumable ? `<div class="resume" style="margin-top:20px"><span>풀던 문제가 있어요 · <b>${saved.pos + 1} / ${saved.deck.length}</b></span><button class="btn" id="resume" type="button">이어서 풀기</button></div>` : ''}
  <form class="panel" id="setup">
    <div class="field"><span class="lbl">성경</span>
      <div class="books" id="books">${BOOKS.map(b => `<button type="button" data-b="${esc(b)}" aria-pressed="${opt.books.includes(b)}">${esc(b)}<span>${ALL.filter(x => x.b === b && !x.isMem).length}</span></button>`).join('')}</div>
      <div class="row"><button type="button" class="linkbtn" id="ball">모두 고르기</button><button type="button" class="linkbtn" id="bnone">모두 빼기</button></div>
    </div>
    <div class="field" id="chapf"><label for="chap">장</label><select id="chap"></select></div>
    <div class="field"><span class="lbl">문제 순서</span>
      <div class="seg" role="group">
        <button type="button" data-mode="seq" aria-pressed="${opt.mode === 'seq'}"><b>차례대로</b><span>1장부터 순서대로</span></button>
        <button type="button" data-mode="rand" aria-pressed="${opt.mode === 'rand'}"><b>무작위</b><span>순서를 섞어서</span></button>
      </div>
    </div>
    <div class="field" id="countf"><label for="count">문제 수</label>
      <select id="count">${['all','10','20','30','50'].map(v => `<option value="${v}" ${opt.count === v ? 'selected' : ''}>${v === 'all' ? '고른 범위 전체' : v + '문제'}</option>`).join('')}</select>
    </div>
    <label class="check"><input type="checkbox" id="mem" ${opt.mem ? 'checked' : ''}> 암송 구절도 함께 풀기</label>
    <div class="hint" id="sum"></div>
    <button class="btn wide" type="submit" id="go">시작하기</button>
  </form>`;
  const deckFor = () => ALL.filter(x => opt.books.includes(x.b) && (x.isMem ? opt.mem && opt.chap === 'all' : (opt.books.length !== 1 || opt.chap === 'all' || x.c === opt.chap)));
  const refresh = () => {
    view.querySelectorAll('#books button').forEach(x => x.setAttribute('aria-pressed', opt.books.includes(x.dataset.b)));
    const one = opt.books.length === 1;
    $('#chapf').hidden = !one;
    if (one){
      const cs = chaptersOf(opt.books[0]);
      if (!cs.includes(opt.chap)) opt.chap = 'all';
      $('#chap').innerHTML = `<option value="all">전체</option>` + cs.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      $('#chap').value = opt.chap;
    } else opt.chap = 'all';
    $('#countf').hidden = opt.mode !== 'rand';
    const n = deckFor().length;
    $('#sum').textContent = n ? `고른 범위: ${n}문제` : '성경을 하나 이상 골라 주세요.';
    $('#go').disabled = !n;
  };
  view.querySelectorAll('#books button').forEach(x => x.onclick = () => {
    const b = x.dataset.b;
    opt.books = opt.books.includes(b) ? opt.books.filter(y => y !== b) : BOOKS.filter(y => y === b || opt.books.includes(y));
    refresh();
  });
  $('#ball').onclick = () => { opt.books = BOOKS.slice(); refresh(); };
  $('#bnone').onclick = () => { opt.books = []; refresh(); };
  $('#chap').onchange = e => { opt.chap = e.target.value; refresh(); };
  $('#mem').onchange = e => { opt.mem = e.target.checked; refresh(); };
  $('#count').onchange = e => { opt.count = e.target.value; };
  view.querySelectorAll('[data-mode]').forEach(x => x.onclick = () => {
    opt.mode = x.dataset.mode;
    view.querySelectorAll('[data-mode]').forEach(y => y.setAttribute('aria-pressed', y === x));
    refresh();
  });
  if (resumable) $('#resume').onclick = () => { S = saved; showQ(); };
  $('#setup').onsubmit = e => {
    e.preventDefault();
    store.set('bz-opt', opt);
    let list = deckFor().map(x => x.id);
    if (opt.mode === 'rand'){ list = shuffle(list); if (opt.count !== 'all') list = list.slice(0, +opt.count); }
    if (!list.length) return;
    S = {deck:list, pos:0, res:{}, mode:opt.mode};
    save(); showQ();
  };
  refresh();
}

/* ---------- question ---------- */
let cur = null;
function renderText(text){
  return esc(text).replace(/\(\u0002\)/g, () => {
    const k = cur.blankIdx++;
    const a = (cur.q.ans || [])[k] || '';
    const w = Math.max(3.2, Math.min(12, [...a].length * 1.15 + 1.6));
    return `(<input class="blank" data-b="${k}" aria-label="빈칸 ${k + 1}" autocomplete="off" style="width:${w}em">)`;
  });
}
function showQ(){
  if (!S) return startScreen();
  if (S.pos >= S.deck.length) return finish();
  const q = ALL[S.deck[S.pos]];
  cur = {q, checked:false, blankIdx:0};
  setBar();
  const T = q.t;
  let body = `<div class="prompt">${renderText(q.q)}</div><div id="ans"></div><div id="fb"></div>`;
  view.innerHTML = `
    <div class="meta"><span class="qno">${esc(label(q))}</span><span class="tag">${q.tag || TYPE[T]}</span><span>${esc(q.c)}${q.ct ? ` · <span class="ctitle">${esc(q.ct)}</span>` : ''}</span></div>
    <article class="card">${body}</article>
    <div class="actions" id="acts"></div>
    <div class="kbd" id="kbd"></div>`;
  const ans = $('#ans');
  if (T === 'mc'){
    ans.innerHTML = `<div class="opts">${q.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><span class="m">${CIRC[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    ans.querySelectorAll('.opt').forEach(b => b.onclick = () => judgeChoice(+b.dataset.i));
  } else if (T === 'short'){
    ans.innerHTML = `<input class="textans" id="ta" placeholder="답을 적어 보세요 (생각만 하고 바로 정답 확인을 눌러도 돼요)" autocomplete="off">`;
  } else if (T === 'memory'){
    ans.innerHTML = `<div class="hintrow"><button type="button" class="btn ghost hintbtn" id="hint">힌트</button><span class="memhint" id="mh"></span></div><textarea class="textans" id="ta" placeholder="말씀을 외워서 적어 보세요"></textarea>`;
    const mw = q.ans.split(/\s+/); cur.hintN = 0;
    $('#hint').onclick = () => {
      if (cur.checked) return;
      if (cur.hintN < mw.length) cur.hintN++;
      $('#mh').textContent = mw.slice(0, cur.hintN).join(' ') + (cur.hintN < mw.length ? ' …' : '');
      $('#hint').textContent = cur.hintN < mw.length ? '한 단어 더' : '힌트 끝';
      if (cur.hintN >= mw.length) $('#hint').disabled = true;
    };
  }
  const needsBtn = T !== 'mc';
  $('#acts').innerHTML = `<button type="button" class="btn ghost" id="skip">건너뛰기</button>${needsBtn ? '<button type="button" class="btn" id="check">정답 확인</button>' : ''}`;
  $('#kbd').textContent = needsBtn ? (T === 'memory' ? 'Ctrl + Enter: 정답 확인' : 'Enter: 정답 확인') : '';
  $('#skip').onclick = () => { if (!cur.checked) { S.res[q.id] = false; } S.pos++; save(); showQ(); };
  if (needsBtn) $('#check').onclick = judgeText;
  const first = view.querySelector('.blank, #ta');
  if (first && matchMedia('(hover:hover)').matches) first.focus({preventScroll:true});
  window.scrollTo({top:0});
}
function record(ok){ S.res[cur.q.id] = ok; save(); setBar(); }
function lock(){
  cur.checked = true;
  view.querySelectorAll('.blank, #ta').forEach(el => el.readOnly = true);
  view.querySelectorAll('.opt, #hint').forEach(b => b.disabled = true);
}
function nextButtons(){
  $('#acts').innerHTML = `<button type="button" class="btn" id="next">${S.pos + 1 >= S.deck.length ? '결과 보기' : '다음 문제 →'}</button>`;
  $('#kbd').textContent = 'Enter: 다음 문제';
  $('#next').onclick = () => { S.pos++; save(); showQ(); };
  $('#next').focus({preventScroll:true});
}
const refLine = q => q.ref ? `<div class="ref">근거: ${esc(q.ref)}</div>` : '';
function verdict(ok, answerHtml, extra = ''){
  lock(); record(ok);
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status"><div class="v">${ok ? '정답이에요!' : '아쉬워요'}</div>${answerHtml ? `<div class="a">${answerHtml}</div>` : ''}${extra}${refLine(cur.q)}</div>`;
  nextButtons(); scrollFb();
}
/* answer shown, learner decides */
function selfCheck(answerHtml, extra = ''){
  lock();
  $('#fb').innerHTML = `<div class="fb neutral" role="status"><div class="v">정답과 비교해 보세요</div><div class="a">${answerHtml}</div>${extra}${refLine(cur.q)}
    <div class="self"><button type="button" class="btn yes" id="sy">맞았어요</button><button type="button" class="btn no" id="sn">틀렸어요</button></div></div>`;
  $('#acts').innerHTML = ''; $('#kbd').textContent = '';
  const pick = ok => { record(ok); const f = $('#fb .fb'); f.className = 'fb ' + (ok ? 'ok' : 'bad'); $('#fb .v').textContent = ok ? '맞았어요!' : '다음엔 꼭 맞혀요'; $('#fb .self').remove(); nextButtons(); };
  $('#sy').onclick = () => pick(true); $('#sn').onclick = () => pick(false);
  $('#sy').focus({preventScroll:true});
  scrollFb();
}
const scrollFb = () => $('#fb').scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
function judgeChoice(i){
  if (cur.checked) return;
  const q = cur.q, ok = i === q.ans;
  view.querySelectorAll('.opt').forEach((b, j) => { if (j === q.ans) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
  verdict(ok, ok ? '' : `정답: ${CIRC[q.ans]} ${esc(q.opts[q.ans])}`);
}
function judgeText(){
  if (cur.checked) return;
  const q = cur.q, T = q.t;
  if (T === 'fill'){
    const ins = [...view.querySelectorAll('.blank')];
    let all = true;
    ins.forEach(el => {
      const k = +el.dataset.b, alts = [q.ans[k], ...((q.alt || {})[k] || [])];
      const ok = el.value.trim() && alts.some(x => norm(x) === norm(el.value));
      el.classList.add(ok ? 'ok' : 'bad'); if (!ok) all = false;
    });
    const shown = `정답: ${q.ans.map(esc).join(', ')}`;
    if (all) return verdict(true, '');
    if (ins.every(el => !el.value.trim())) return selfCheck(shown);
    return selfCheck(shown, '<div class="small">빨간 칸이 정답과 달라요. 뜻이 같으면 맞았어요를 누르세요.</div>');
  }
  if (T === 'short'){
    const v = $('#ta').value;
    const ok = v.trim() && (q.alt || [q.ans]).concat([q.ans]).some(a => a && norm(a) === norm(v));
    if (ok) return verdict(true, `정답: ${esc(q.ans)}`);
    return selfCheck(`정답: ${esc(q.ans)}`, v.trim() ? `<div class="small">내 답: ${esc(v)}</div>` : '');
  }
  if (T === 'memory'){
    const v = $('#ta').value, r = similarity(v, q.ans);
    if (r >= 0.97) return verdict(true, esc(q.ans));
    return selfCheck(esc(q.ans), v.trim() ? `<div class="small">내가 쓴 말씀과 ${Math.round(r * 100)}% 같아요.</div>` : '');
  }
}

/* ---------- finish ---------- */
function finish(){
  S.done = true; save(); setBar(); cur = null;
  const total = S.deck.length, ok = S.deck.filter(id => S.res[id]).length;
  const wrong = S.deck.filter(id => !S.res[id]);
  view.innerHTML = `
  <section class="hero"><h1>다 풀었어요</h1><p>${S.mode === 'rand' ? '무작위' : '차례대로'} · ${total}문제</p></section>
  <div class="panel">
    <div class="score">${ok}<small> / ${total}</small></div>
    <div>${Math.round(100 * ok / total)}% 맞혔어요.</div>
    ${wrong.length ? `<div class="field"><span class="lbl">틀리거나 건너뛴 문제 ${wrong.length}개</span><div class="wrong">${wrong.slice().sort((a, b) => a - b).map(id => `<span>${esc(label(ALL[id]))}</span>`).join('')}</div></div>` : ''}
    <div class="row">
      ${wrong.length ? '<button type="button" class="btn" id="retry">틀린 문제만 다시 풀기</button>' : ''}
      <button type="button" class="btn ghost" id="again">처음으로</button>
    </div>
  </div>`;
  if (wrong.length) $('#retry').onclick = () => { S = {deck: S.mode === 'rand' ? shuffle(wrong) : wrong.slice().sort((a, b) => a - b), pos:0, res:{}, mode:S.mode}; save(); showQ(); };
  $('#again').onclick = () => { store.del('bz-session'); startScreen(); };
}

document.addEventListener('keydown', e => {
  if (!cur || !S || S.done || e.key !== 'Enter' || e.isComposing) return;
  const inTA = e.target.tagName === 'TEXTAREA';
  if (inTA && !(e.ctrlKey || e.metaKey)) return;
  if (e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  if (cur.checked){ const n = $('#next'); if (n) n.click(); }
  else if ($('#check')) judgeText();
});
$('#home').onclick = () => startScreen();
startScreen();
})();
</script>

</body></html>
